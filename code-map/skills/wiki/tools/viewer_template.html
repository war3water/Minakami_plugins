<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__WIKI_TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One-file wiki viewer built by wiki.py viewer: README first, a sidebar in the index's reading order, an outline of the
   page on show, search that says where the words occur, previous and next page, source chips that open the editor,
   code blocks with a copy button, diagrams that open in a zoom and pan view, a note on each command the check does not
   run, and a notice on pages that may be out of date. Either side bar folds away; on a narrow screen the sidebar is
   a drawer. No network access:
   the script, the styles and the font are in the file. Nothing here is read by a model; wiki.py copies it. */
@font-face { font-family: "JetBrains Mono"; font-weight: 100 800; font-style: normal; font-display: swap;
  src: url(data:font/woff2;base64,/*FONT_MONO*/) format("woff2"); }
/* The look: dense and technical, for a window beside the editor. Every colour, face and size is a token, light first,
   then dark twice: for a system set to dark, and for a reader who picked dark. */
:root {
  --bg: #f3f5f1; --side: #e9ece6; --panel: #fbfcfa; --ink: #151a16; --ink-2: #2f3832; --muted: #5f6c63; --line: #d5dbd2; --line-2: #b5beb3;
  --accent: #0a6a46; --accent-soft: #d8ecdf; --hover: #dfe4dc; --sel: #bfe3cf; --mark: #ffe08a; --mark-ink: #151a16; --strong: #0b0f0c;
  --link: #0a6a46; --link-line: #8fc2a8; --code-bg: #e3e8e0; --code-ink: #1d2a22;
  --pre-bg: #0f1410; --pre-ink: #d5e2d7; --pre-line: #0f1410; --pre-muted: #7d8f82; --pre-btn: #19211b; --pre-btn-line: #33403a;
  --tok-com: #74867a; --tok-str: #e3c078; --tok-kw: #6fdca6; --tok-num: #f0a36b; --tok-flag: #8fc7e8; --tok-var: #f0a36b;
  --warn: #7d4f00; --warn-soft: #f6ebcd; --bad: #a3261b; --bad-soft: #f6dfda; --row-hover: #eef2ec; --th-ink: #2f3832; --fig-filter: none;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --head: var(--mono); --ui: var(--body); --nav: var(--body); --label: var(--mono); --th: var(--mono); --cap: var(--mono);
  --fs: 15px; --lh: 1.62; --measure: 82ch; --content: 920px; --side-w: 264px; --toc-w: 204px; --top: 32px; --scroll-m: 20px;
  --h1: 28px; --h1-w: 700; --h1-ls: -.03em; --h2: 18.5px; --h2-w: 700; --h2-ls: -.015em; --h2-gap: 2.5em; --h3: 15.5px; --h3-w: 700;
  --brand-w: 700; --brand-fs: 15px; --brand-ls: -.02em;
  --label-w: 500; --label-fs: 11px; --label-ls: .04em; --label-case: lowercase; --eyebrow-fs: 11.5px;
  --nav-fs: 13.5px; --nav-pad: 4px 10px; --nav-radius: 2px; --nav-now-w: 600; --bold: 650; --code-fs: .86em; --pre-fs: 12.5px;
  --table-fs: 13.5px; --cell-pad: 6px 11px; --th-w: 500; --th-fs: 11px; --th-ls: .03em; --th-case: lowercase;
  --cap-style: normal; --pager-w: 700; --radius: 3px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0e0c; --side: #080a09; --panel: #111512; --ink: #dce5de; --ink-2: #b6c3b9; --muted: #7c8b80; --line: #1e2621; --line-2: #2f3a33;
  --accent: #62d9a3; --accent-soft: #11291e; --hover: #131815; --sel: #1d4a35; --mark: #6a5312; --mark-ink: #fff1c4; --strong: #f0f5f1;
  --link: #62d9a3; --link-line: #2c6a4e; --code-bg: #171e19; --code-ink: #cde0d2;
  --pre-bg: #050706; --pre-ink: #d5e2d7; --pre-line: #1e2621; --pre-muted: #74867a; --pre-btn: #111512; --pre-btn-line: #2f3a33;
  --tok-com: #6b7d71; --tok-str: #e3c078; --tok-kw: #62d9a3; --tok-num: #f0a36b; --tok-flag: #8fc7e8; --tok-var: #f0a36b;
  --warn: #e9b65c; --warn-soft: #2e2410; --bad: #f08a80; --bad-soft: #3a1c19; --row-hover: #0f1311; --th-ink: #b6c3b9; --fig-filter: invert(.93) hue-rotate(180deg);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b0e0c; --side: #080a09; --panel: #111512; --ink: #dce5de; --ink-2: #b6c3b9; --muted: #7c8b80; --line: #1e2621; --line-2: #2f3a33;
  --accent: #62d9a3; --accent-soft: #11291e; --hover: #131815; --sel: #1d4a35; --mark: #6a5312; --mark-ink: #fff1c4; --strong: #f0f5f1;
  --link: #62d9a3; --link-line: #2c6a4e; --code-bg: #171e19; --code-ink: #cde0d2;
  --pre-bg: #050706; --pre-ink: #d5e2d7; --pre-line: #1e2621; --pre-muted: #74867a; --pre-btn: #111512; --pre-btn-line: #2f3a33;
  --tok-com: #6b7d71; --tok-str: #e3c078; --tok-kw: #62d9a3; --tok-num: #f0a36b; --tok-flag: #8fc7e8; --tok-var: #f0a36b;
  --warn: #e9b65c; --warn-soft: #2e2410; --bad: #f08a80; --bad-soft: #3a1c19; --row-hover: #0f1311; --th-ink: #b6c3b9; --fig-filter: invert(.93) hue-rotate(180deg);
  color-scheme: dark }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: var(--fs)/var(--lh) var(--body); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
::selection { background: var(--sel); }
::highlight(hit) { background: var(--mark); color: var(--mark-ink); }
::highlight(hit-now) { background: var(--accent); color: var(--bg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* ---- frame: page list | page | outline ---- */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin;
  background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px;
  padding: 24px 14px 16px max(18px, env(safe-area-inset-left, 0px)); }
.stage { min-width: 0; width: 100%; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr) var(--toc-w); gap: 0 44px;
  max-width: calc(var(--content) + var(--toc-w) + 44px + 84px);
  padding-block: var(--top) 96px; padding-left: 48px; padding-right: max(36px, env(safe-area-inset-right, 0px)); }
#page { min-width: 0; }
.topbar, .scrim { display: none; }
/* either side bar folds away for a wider page; a small button at the window's edge brings it back */
.rail-btn { flex: none; display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 1px solid var(--line-2); border-radius: var(--radius);
  background: var(--panel); color: var(--muted); cursor: pointer; }
.rail-btn:hover { color: var(--accent); border-color: var(--accent); }
.rail-btn.float { display: none; position: fixed; top: 14px; z-index: 15; }
.rail-btn.float.left { left: max(12px, env(safe-area-inset-left, 0px)); }
.rail-btn.float.right { right: max(14px, env(safe-area-inset-right, 0px)); }
.side-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.side-head .brand { min-width: 0; padding-right: 0; }
.toc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 10px; }
.toc .toc-head h4 { margin: 0; }
@media (min-width: 861px) {
  .side-off .shell { grid-template-columns: minmax(0, 1fr); }
  .side-off .side { display: none; }
  .side-off #side-show { display: grid; }
}
@media (min-width: 1181px) {
  .toc-off .stage { grid-template-columns: minmax(0, 1fr); max-width: calc(var(--content) + 48px + 56px); padding-right: max(56px, env(safe-area-inset-right, 0px)); }
  .toc-off .toc { display: none; }
  .toc-off #toc:not([hidden]) + #toc-show { display: grid; }
}

/* ---- page list ---- */
.brand { font: var(--brand-w) var(--brand-fs)/1.2 var(--head); letter-spacing: var(--brand-ls); overflow-wrap: anywhere; padding: 0 8px; }
.brand small { display: block; margin-top: 5px; font: 400 12.5px/1.4 var(--ui); letter-spacing: 0; color: var(--muted); }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; translate: 0 -50%; color: var(--muted); pointer-events: none; }
.search kbd { position: absolute; right: 8px; top: 50%; translate: 0 -50%; font: 500 11px/1 var(--mono); color: var(--muted);
  border: 1px solid var(--line-2); border-radius: 4px; padding: 3px 5px; pointer-events: none; }
#q { width: 100%; padding: 8px 30px 8px 32px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--panel);
  color: var(--ink); font: 14px/1.4 var(--ui); }
#q::placeholder { color: var(--muted); }
#q:focus-visible { outline-offset: 0; border-color: var(--accent); }
#q:focus + kbd, #q:not(:placeholder-shown) + kbd { display: none; }
#nav { flex: 1 0 auto; }
.group { display: grid; gap: 1px; margin-bottom: 14px; }
.group h3 { margin: 0 0 4px; padding: 0 10px; font: var(--label-w) var(--label-fs)/1.4 var(--label); letter-spacing: var(--label-ls);
  text-transform: var(--label-case); color: var(--muted); }
.group button, .res { display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer; padding: var(--nav-pad);
  border-radius: var(--nav-radius); font: 400 var(--nav-fs)/1.35 var(--nav); color: var(--ink-2); }
.group button:hover, .res:hover, .snip:hover { background: var(--hover); color: var(--ink); }
.group button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: var(--nav-now-w); }
.results .rhead { margin: 0 0 8px; padding: 0 10px; font: 13px/1.4 var(--ui); color: var(--muted); }
.res { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-weight: 600; color: var(--ink); margin-top: 6px; }
.res .n { flex: none; font: 500 11.5px/1 var(--mono); color: var(--muted); }
.snip { display: block; width: 100%; text-align: left; border: 0; background: none; cursor: pointer; border-radius: var(--nav-radius);
  padding: 3px 10px 3px 20px; font: 12.5px/1.45 var(--ui); color: var(--muted); overflow-wrap: anywhere; }
.snip mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }
.status { font: 13px/1.45 var(--ui); color: var(--warn); background: var(--warn-soft); border-radius: var(--radius); padding: 9px 11px; }
.status button { display: block; text-align: left; border: 0; background: none; color: inherit; padding: 2px 0; text-decoration: underline; cursor: pointer; }
.foot { display: grid; gap: 10px; border-top: 1px solid var(--line); padding: 12px 8px 0; font: 12.5px/1.4 var(--ui); color: var(--muted); }
.foot .links { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.foot .links button { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; text-decoration-color: var(--line-2);
  text-underline-offset: 3px; cursor: pointer; }
.foot .links button:hover, .foot .links button[aria-current="true"] { color: var(--accent); }
.foot .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 7px; padding: 2px; gap: 2px; background: var(--panel); }
.seg button { display: grid; place-items: center; width: 28px; height: 24px; border: 0; border-radius: 5px; background: none; color: var(--muted); cursor: pointer; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

/* ---- outline of the page ---- */
.toc { position: sticky; top: var(--top); align-self: start; max-height: calc(100vh - var(--top) - 24px); overflow-y: auto; scrollbar-width: thin;
  font: 13px/1.4 var(--ui); padding-bottom: 8px; }
.toc h4 { margin: 0 0 10px; font: var(--label-w) var(--label-fs)/1.4 var(--label); letter-spacing: var(--label-ls); text-transform: var(--label-case); color: var(--muted); }
.toc a { display: block; padding: 4px 0 4px 13px; border-left: 1px solid var(--line); color: var(--muted); text-decoration: none; text-wrap: pretty; }
.toc a.l3 { padding-left: 26px; font-size: 12.5px; }
.toc a:hover { color: var(--ink); }
.toc a[aria-current="true"] { color: var(--accent); border-left-color: var(--accent); }

/* ---- page head ---- */
.eyebrow { margin: 0 0 12px; font: var(--label-w) var(--eyebrow-fs)/1.4 var(--label); letter-spacing: var(--label-ls); text-transform: var(--label-case); color: var(--accent); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 0 0 26px; font: 13px/1.4 var(--ui); color: var(--muted); max-width: none; }
.meta .when + .when::before { content: "\b7"; margin-right: 10px; }
.chip { font: 500 12px/1 var(--mono); padding: 5px 8px; border-radius: 4px; background: var(--code-bg); color: var(--code-ink); text-decoration: none; }
a.chip.src:hover { outline: 1px solid var(--accent); }
.chip.missing { background: var(--bad-soft); color: var(--bad); }
.chip.more, .chip.page-comment { font: 500 12.5px/1 var(--ui); border: 1px solid var(--line-2); background: none; color: var(--ink-2); cursor: pointer; padding: 5px 9px; border-radius: 99px; }
.chip.more:hover, .chip.page-comment:hover { border-color: var(--accent); color: var(--accent); }
.chip.more[aria-expanded="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.srcs { display: flex; flex-wrap: wrap; gap: 6px; margin: -12px 0 26px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
.notice { border: 1px solid var(--warn); background: var(--warn-soft); color: var(--warn); border-radius: var(--radius); padding: 9px 13px; margin: 0 0 18px; font: 14px/1.5 var(--ui); }
.notice ul { margin: 4px 0 0; padding-left: 18px; }
#comment-sel { position: absolute; z-index: 40; font: 600 13px/1 var(--ui); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--bg); cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.18); }

/* ---- page text ---- */
article { overflow-wrap: break-word; }
article p, article li, article dd, article blockquote { max-width: var(--measure); }
article p:has(> img) { max-width: none; }
article h1 { margin: 0 0 14px; font: var(--h1-w) var(--h1)/1.12 var(--head); letter-spacing: var(--h1-ls); text-wrap: balance; }
article h2 { margin: var(--h2-gap) 0 .6em; font: var(--h2-w) var(--h2)/1.25 var(--head); letter-spacing: var(--h2-ls); text-wrap: balance; }
article h3 { margin: 2em 0 .5em; font: var(--h3-w) var(--h3)/1.3 var(--head); text-wrap: balance; }
article h4, article h5, article h6 { margin: 1.6em 0 .4em; font: 600 1em/1.4 var(--head); }
article :is(h1, h2, h3, h4) { scroll-margin-top: var(--scroll-m); position: relative; }
article :is(h2, h3) .hanchor { position: absolute; right: 100%; top: 0; padding-right: 8px; color: var(--muted); text-decoration: none; opacity: 0; font-weight: 400; }
article :is(h2, h3) .hanchor::after { content: "#"; }
article :is(h2, h3):hover .hanchor, article .hanchor:focus-visible { opacity: 1; }
article .hanchor:hover { color: var(--accent); }
article p { margin: 0 0 1.05em; }
article ul, article ol { margin: 0 0 1.05em; padding-left: 1.45em; }
article li { margin: .32em 0; }
article li > p { margin: 0 0 .4em; }
article li::marker { color: var(--muted); }
article strong, article b { font-weight: var(--bold); color: var(--strong); }
article a { color: var(--link); text-decoration: underline; text-decoration-color: var(--link-line); text-decoration-thickness: 1px; text-underline-offset: .2em; }
article a:hover { text-decoration-color: currentColor; }
article a.code-link { color: inherit; text-decoration: underline dotted var(--muted); }
article a.code-link.inert { text-decoration: none; cursor: default; }
article hr { border: 0; border-top: 1px solid var(--line); margin: 2.4em 0; }
article code { font: var(--code-fs) var(--mono); background: var(--code-bg); color: var(--code-ink); padding: .13em .38em; border-radius: 4px; }
article a > code { color: inherit; }
article blockquote { margin: 1.2em 0; padding: .1em 0 .1em 1.1em; border-left: 3px solid var(--accent); color: var(--ink-2); }
article blockquote > :last-child { margin-bottom: 0; }
article kbd { font: .82em var(--mono); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: .05em .4em; background: var(--panel); }
article img { display: block; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: var(--radius); }
article p[align="center"] img { margin-inline: auto; }

/* tables: rules, not a grid; code in a cell is text, not a chip */
.table-wrap { overflow-x: auto; margin: 1.2em 0 1.7em; scrollbar-width: thin; }
.table-wrap table { border-collapse: collapse; font-size: var(--table-fs); line-height: 1.5; }
.table-wrap th, .table-wrap td { text-align: left; vertical-align: top; padding: var(--cell-pad); border-bottom: 1px solid var(--line); }
.table-wrap th { font: var(--th-w) var(--th-fs)/1.4 var(--th); letter-spacing: var(--th-ls); text-transform: var(--th-case); color: var(--th-ink);
  border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.table-wrap td code { background: none; padding: 0; font-size: .9em; color: var(--code-ink); }
.table-wrap td.nw { white-space: nowrap; }
.table-wrap tbody tr:hover td { background: var(--row-hover); }

/* code blocks */
.codeblock { position: relative; margin: 1.15em 0 1.5em; }
.codeblock pre { margin: 0; background: var(--pre-bg); color: var(--pre-ink); border: 1px solid var(--pre-line); border-radius: var(--radius);
  padding: 14px 16px; overflow-x: auto; font: var(--pre-fs)/1.6 var(--mono); tab-size: 4; scrollbar-width: thin; }
.codeblock pre code { background: none; padding: 0; color: inherit; font: inherit; border-radius: 0; }
.codeblock .tools { position: absolute; top: 7px; right: 8px; display: flex; gap: 8px; align-items: center; opacity: 0; transition: opacity .12s; }
.codeblock:hover .tools, .codeblock:focus-within .tools { opacity: 1; }
.codeblock .lang { font: 500 10.5px/1 var(--ui); letter-spacing: .07em; text-transform: uppercase; color: var(--pre-muted); }
.codeblock .copy { font: 500 12px/1 var(--ui); padding: 5px 8px; border-radius: 5px; border: 1px solid var(--pre-btn-line); background: var(--pre-btn); color: var(--pre-ink); cursor: pointer; }
.codeblock .copy:hover { border-color: var(--pre-muted); }
.codeblock .copy::after, .codeblock .lang::after { content: attr(data-label); }
@media (hover: none) { .codeblock .tools { opacity: 1; } .codeblock pre { padding-right: 70px; } }
.t-c { color: var(--tok-com); font-style: italic; } .t-s { color: var(--tok-str); } .t-k { color: var(--tok-kw); }
.t-n { color: var(--tok-num); } .t-f { color: var(--tok-flag); } .t-v { color: var(--tok-var); } .t-p { color: var(--pre-muted); user-select: none; }
.check-note { max-width: var(--measure); font: 13.5px/1.5 var(--ui); color: var(--muted); border-left: 2px solid var(--warn); padding: 1px 0 1px 10px; margin: 1.1em 0 -.55em; }

/* diagrams */
article p.fig { margin: 1.3em 0 0; }
.figbox { display: inline-block; max-width: 100%; vertical-align: top; line-height: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.figbox img { border: 0; border-radius: 0; background: #ffffff; padding: 14px; filter: var(--fig-filter); cursor: zoom-in; }
.figbox:hover, .figbox:focus-within { border-color: var(--accent); }
.figbox img:focus-visible { outline: none; }
.zoom-hint { max-width: none; margin: 8px 0 1.5em; font: var(--cap-style) 13px/1.45 var(--cap); color: var(--muted); }
.zoom-hint span { color: var(--line-2); margin: 0 6px; }
.missing-diagram { padding: 10px 12px; border: 1px dashed var(--warn); background: var(--warn-soft); color: var(--warn); border-radius: var(--radius); font: 14px var(--ui); }

/* folded parts */
article details { margin: .7em 0 1.5em; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
article summary { cursor: pointer; padding: 8px 12px; font: 500 13.5px/1.4 var(--ui); color: var(--ink-2); list-style: none; display: flex; align-items: center; gap: 9px; }
article summary::-webkit-details-marker { display: none; }
article summary::before { content: ""; flex: none; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); rotate: -45deg; transition: rotate .12s; }
article details[open] > summary::before { rotate: 45deg; }
article details[open] > summary { border-bottom: 1px solid var(--line); }
article details > :not(summary) { margin-inline: 12px; }
article details > .codeblock, article details > .table-wrap { margin-block: 12px; }
/* where the page sits on the reading route, beside the group's name */
.eyebrow .route { margin-left: 10px; color: var(--muted); text-transform: none; letter-spacing: 0; }
.eyebrow .route > span { margin-left: 10px; white-space: nowrap; }

.st-band:nth-child(6n+2) { --ph: var(--ph-2); } .st-band:nth-child(6n+3) { --ph: var(--ph-3); } .st-band:nth-child(6n+4) { --ph: var(--ph-4); }

<script>
const W = /*WIKI_DATA*/null;
// The sidebar in the words docs sites use; the page kinds behind them are the schema's (Diátaxis). The wiki's own
// rules and log are for its maintainers, so they sit in the footer, not among the pages.
const GROUPS = [["Start here", ["readme", "index"]], ["Tutorials", ["tutorial"]], ["How it works", ["explanation"]],
                ["Guides", ["how-to"]], ["Reference", ["reference"]]];
const FOOT = [["schema", "How this wiki is kept"], ["log", "Change log"]];
const byId = new Map(W.pages.map(p => [p.id, p]));
const rank = p => [p.kind === "readme" ? -2 : p.kind === "index" ? -1 : (p.order ?? 1e6), p.title];  // the index's reading order
const byRank = (a, b) => { const [x, y] = [rank(a), rank(b)]; return x[0] - y[0] || x[1].localeCompare(y[1]); };

const known = GROUPS.flatMap(g => g[1]).concat(FOOT.map(f => f[0]));
const grouped = () => GROUPS.concat([["Other", null]])
  .map(([label, kinds]) => [label, W.pages.filter(p => kinds ? kinds.includes(p.kind) : !known.includes(p.kind)).sort(byRank)])
  .filter(g => g[1].length);
const ORDER = grouped().flatMap(([label, items]) => items.map(p => (p.group = label, p)));  // reading order, for previous and next
const navTitle = p => p.kind === "index" ? "All pages" : p.title;
const $ = id => document.getElementById(id);

// Page addresses: anchors may only hold letters, digits and . _ ~ -, so "/" becomes "~" and "~~" starts a heading.
const toHash = (id, sec) => "#" + id.replace(/\//g, "~") + (sec ? "~~" + sec : "");
function fromHash(h) { const [id, sec] = decodeURIComponent(h.replace(/^#/, "")).split("~~"); return [id.replace(/~/g, "/"), sec || ""]; }

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const slugify = t => t.trim().toLowerCase().replace(/[^\p{L}\p{N}\p{M}_\- ]/gu, "").replace(/ /g, "-");  // GitHub's anchors
function resolve(from, href) {  // a link's target, relative to the repository root
  const parts = from.split("/").slice(0, -1);
  const segs = href.startsWith("/") ? (parts.length = 0, href.slice(1).split("/")) : href.split("/");
  for (const seg of segs) { if (seg === "..") parts.pop(); else if (seg !== "." && seg !== "") parts.push(seg); }
  return parts.join("/");
}
function editorUrl(path, line) {
  if (!W.editor) return null;
  return W.editor.replace("{abs_path}", W.repoRoot + "/" + path).replace("{rel_path}", path).replace("{line}", line || 1)
                 .replace("{col}", 1).replace("{project}", encodeURIComponent(W.repo));
}

// Page HTML comes from repository files; keep the structure Markdown needs and drop anything that could run code.
const ALLOWED = new Set(("a abbr b blockquote br caption code col colgroup dd del details div dl dt em figcaption figure h1 h2 h3 h4 h5 h6 hr i " +
  "img input kbd li mark ol p picture pre q s samp small source span strong sub summary sup table tbody td tfoot th thead tr u ul var").split(" "));

function clean(node) {
  for (const child of [...node.childNodes]) {

    if (child.nodeType !== 1) continue;

    if (!ALLOWED.has(tag)) { child.replaceWith(...child.childNodes); continue; }

      if (parts) only.innerHTML = `<span class="ct-file">${esc(parts[1])}:</span> ${esc(parts[2])}`;

      const under = kids.get(k);
      if (!under) return li;
      if (done.has(k)) {
        const again = document.createElement("span"); again.className = "ct-again"; again.dataset.ui = "";
        again.textContent = "its calls are listed above"; li.append(again);
        return li;
      }
      done.add(k);
      const ul = document.createElement("ul"); under.forEach(b => ul.append(item(b))); li.append(ul);
      return li;
    };
    const tree = document.createElement("ul"); tree.className = "calltree";
    roots.forEach(k => tree.append(item(cell.get(k))));
    // a caller no root reaches (a loop of calls) still shows
    [...kids.keys()].filter(k => !done.has(k)).forEach(k => { if (!done.has(k)) tree.append(item(cell.get(k))); });
    t.replaceWith(tree);
    const fold = tree.closest("details"), sum = fold && fold.querySelector(":scope > summary");
    if (sum && !sum.querySelector(".sum-note")) {
      const note = document.createElement("span"); note.className = "sum-note"; note.dataset.ui = "";
      note.textContent = `${rows.length} calls as a tree, with the helpers the picture leaves out`;
      sum.append(note);
    }
  });
  // Tables scroll inside their own box; a first cell that is one name or path stays on one line.
  el.querySelectorAll("table").forEach(t => {
    const wrap = document.createElement("div"); wrap.className = "table-wrap"; t.replaceWith(wrap); wrap.append(t);
    t.querySelectorAll("td:first-child").forEach(td => {
      const only = td.children.length === 1 && td.firstElementChild;
      if (only && only.matches("code, a") && only.textContent.trim() === td.textContent.trim() && td.textContent.length <= 52) td.classList.add("nw");
    });
  });
  el.querySelectorAll("pre").forEach(pre => {
    if (pre.closest(".math-error")) return;
    const code = pre.querySelector("code"), lang = ((code && code.className.match(/language-([\w+#.-]+)/)) || [])[1] || "";
    const box = document.createElement("div"); box.className = "codeblock"; pre.replaceWith(box); box.append(pre);
    const painted = code && paintCode(code.textContent, lang.toLowerCase());
    if (painted !== null && code) code.innerHTML = painted;
    const tools = document.createElement("div"); tools.className = "tools"; tools.dataset.ui = "";
    tools.innerHTML = (lang && lang !== "text" ? `<span class="lang" data-label="${esc(lang)}"></span>` : "") +
      `<button type="button" class="copy" data-label="Copy" aria-label="Copy this block"></button>`;
    tools.querySelector(".copy").addEventListener("click", e => copyBlock(e.currentTarget));
    box.append(tools);
  });
  // A capability card: a heading, and under it a list whose items start "Try it:", "How:", "Open first:" and
  // "Go deeper:". Each shows as a card with its labels set apart; cards that follow one another share a grid, so
  // the reader sees every capability at the same depth and in the same shape.
  el.querySelectorAll("ul").forEach(ul => {
    const items = [...ul.children];
    const labelled = items.filter(li => li.firstElementChild && li.firstElementChild.matches("strong") &&
      /^(try it|how|open first|go deeper):?$/i.test(li.firstElementChild.textContent.trim()));
    const head = ul.previousElementSibling;
    if (labelled.length < 3 || labelled.length !== items.length || !head || !/^H[2-6]$/.test(head.tagName)) return;
    const card = document.createElement("div"); card.className = "cap-card"; head.before(card); card.append(head, ul);
    ul.classList.add("cap-rows");
    items.forEach(li => {
      const s = li.firstElementChild; s.className = "cap-label"; s.textContent = s.textContent.trim().replace(/:$/, "");
      const next = s.nextSibling;
      if (next && next.nodeType === 3) next.textContent = next.textContent.replace(/^\s*:?\s*/, "");
    });
    const before = card.previousElementSibling;
    if (before && before.classList.contains("cap-grid")) before.append(card);
    else { const grid = document.createElement("div"); grid.className = "cap-grid"; card.before(grid); grid.append(card); }
  });
  // The folded block under a picture holds the Mermaid text the picture is drawn from. Say so beside its name, and
  // set it close under the caption, so that a reader who opens it is not left expecting a second picture.
  el.querySelectorAll("details").forEach(d => {
    const hint = d.previousElementSibling, sum = d.querySelector(":scope > summary");
    if (!sum || !hint || !hint.classList.contains("zoom-hint") || !d.querySelector(":scope > .codeblock code.language-mermaid")) return;
    d.classList.add("diagram-src"); hint.classList.add("has-src");
    const note = document.createElement("span"); note.className = "sum-note"; note.dataset.ui = "";
    note.textContent = "the text the picture above is drawn from";
    sum.append(note);
  });
  el.querySelectorAll("h2, h3").forEach(h => {  // a link to the section, shown beside its heading on hover
    const a = document.createElement("a"); a.className = "hanchor"; a.dataset.ui = ""; a.href = toHash(id, h.dataset.slug);
    a.setAttribute("aria-label", "Link to this section");
    a.addEventListener("click", e => { e.preventDefault(); toSection(id, h.dataset.slug); });
    h.prepend(a);
  });
  p.text = textNodes(el)[1]; p.low = p.text.toLowerCase();
  if (p.low.length !== p.text.length) p.low = p.text;
  // Under the title: when the page was last checked, how long it takes to read, and the code it explains. The code
  // list is for the developer who goes there next; it opens on request, so the page starts with its text.
  const minutes = Math.round(p.text.split(/\s+/).length / 220);
  const bits = [p.updated && `<span class="when">Updated ${esc(p.updated)}</span>`, minutes > 1 && `<span class="when">${minutes} min read</span>`];
  if (p.sources.length) bits.push(`<button type="button" class="chip more" aria-expanded="false">Code this page explains (${p.sources.length})</button>`);
  meta.innerHTML = bits.filter(Boolean).join("");
  const title = el.querySelector(":scope > h1:first-child");
  if (title) title.after(meta);
  if (!meta.childElementCount) meta.hidden = true;
  const more = meta.querySelector(".more");
  if (more) {
    const srcs = document.createElement("div"); srcs.className = "srcs"; srcs.dataset.ui = ""; srcs.hidden = true;
    srcs.innerHTML = p.sources.map(s => {
      const url = s.ok ? editorUrl(s.path, s.line) : null, where = s.ok ? `${s.path}${s.line ? ":" + s.line : ""}` : "not found in the code";
      return url ? `<a class="chip src" href="${esc(url)}" title="Open in editor: ${esc(where)}">${esc(s.ref)}</a>`
                 : `<span class="chip src${s.ok ? "" : " missing"}" title="${esc(where)}">${esc(s.ref)}</span>`;
    }).join("");
    meta.after(srcs);
    more.onclick = () => { srcs.hidden = !srcs.hidden; more.setAttribute("aria-expanded", String(!srcs.hidden)); };
  }
  const at = ORDER.indexOf(p), prev = at > 0 ? ORDER[at - 1] : null, next = at >= 0 && at < ORDER.length - 1 ? ORDER[at + 1] : null;
  // Where this page sits on the reading route, at its top: the pages are read in the index's order.
  if (at >= 0 && ORDER.length > 2 && p.group) {
    const route = document.createElement("span"); route.className = "route"; route.dataset.ui = "";
    route.innerHTML = `<span class="route-at">${at + 1} of ${ORDER.length}</span>` +
      (prev ? `<span>after <button type="button" data-go="${esc(prev.id)}">${esc(navTitle(prev))}</button></span>` : "") +
      (next ? `<span>next <button type="button" data-go="${esc(next.id)}">${esc(navTitle(next))}</button></span>` : "");
    sect.querySelector(".eyebrow").append(route);
  }
  if (prev || next) {
    const pager = document.createElement("nav"); pager.className = "pager"; pager.setAttribute("aria-label", "Previous and next page");
    pager.innerHTML = (prev ? `<button type="button" class="prev" data-go="${esc(prev.id)}"><small>Previous</small><span>${esc(navTitle(prev))}</span></button>` : "") +
                      (next ? `<button type="button" class="next" data-go="${esc(next.id)}"><small>Next</small><span>${esc(navTitle(next))}</span></button>` : "");
    sect.append(pager);
  }
  $("page").appendChild(sect);
  sections.set(id, sect);
}

function toSection(id, sec) {
  const to = sec && sections.get(id).querySelector(`[data-slug="${CSS.escape(sec)}"]`);
  try { history.replaceState(null, "", toHash(id, sec)); } catch (err) {}
  if (to) to.scrollIntoView(); else window.scrollTo(0, 0);
}
// The outline of the page on show: its second- and third-level headings, the one being read marked.
function outline() {
  const toc = $("toc"), heads = [...sections.get(current).querySelectorAll("article h2, article h3")];
  toc.hidden = heads.length < 2;
  toc.innerHTML = toc.hidden ? "" : `<div class="toc-head"><h4>On this page</h4><button class="rail-btn" id="toc-hide" type="button" ` +
    `aria-label="Hide the outline of this page" title="Hide the outline of this page  ( ] )" aria-controls="toc" aria-expanded="true">${$("toc-show").innerHTML}</button></div>` + heads.map(h =>
    `<a class="l${h.tagName[1]}" href="${esc(toHash(current, h.dataset.slug))}" data-slug="${esc(h.dataset.slug)}">${esc(h.textContent)}</a>`).join("");
  spy();
}
let spyQueued = false;
function spy() {
  spyQueued = false;
  const toc = $("toc"); if (toc.hidden) return;
  let now = null;
  const heads = [...sections.get(current).querySelectorAll("article h2, article h3")];
  for (const h of heads) { if (h.getBoundingClientRect().top <= 150) now = h; else break; }
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4 && window.scrollY > 0) now = heads[heads.length - 1];  // the end of the page
  toc.querySelectorAll("a").forEach(a => a.setAttribute("aria-current", String(!!now && a.dataset.slug === now.dataset.slug)));
}
window.addEventListener("scroll", () => { if (!spyQueued) { spyQueued = true; requestAnimationFrame(spy); } }, { passive: true });
$("toc").addEventListener("click", e => {
  if (e.target.closest("#toc-hide")) { fold("toc", true); $("toc-show").focus(); return; }
  const a = e.target.closest("a[data-slug]"); if (a) { e.preventDefault(); toSection(current, a.dataset.slug); }
});

// Either side bar folds away for a wider page: the page list on the left, the outline on the right. The choice is
// remembered in this browser when storage is available. On a narrow screen the page list is a drawer instead.
const folded = { side: false, toc: false };
function fold(which, off, keep) {
  folded[which] = off; document.body.classList.toggle(which + "-off", off);
  if (keep !== false) { try { localStorage.setItem("code-map-wiki-" + which, off ? "off" : "on"); } catch (e) {} }
  if (!off && which === "toc") spy();
}
for (const which of ["side", "toc"]) { try { if (localStorage.getItem("code-map-wiki-" + which) === "off") fold(which, true, false); } catch (e) {} }
$("side-hide").addEventListener("click", () => { fold("side", true); $("side-show").focus(); });
$("side-show").addEventListener("click", () => { fold("side", false); $("side-hide").focus(); });
$("toc-show").addEventListener("click", () => { fold("toc", false); const b = $("toc-hide"); if (b) b.focus(); });

// Search marks every place the words occur on the page on show, without touching the page's DOM.
function mark(nth) {
  const paint = window.Highlight && window.CSS && CSS.highlights;
  if (paint) { CSS.highlights.delete("hit"); CSS.highlights.delete("hit-now"); }
  const q = query(); if (!q) return [];
  const found = findRanges(sections.get(current).querySelector("article"), q);
  if (paint && found.length) CSS.highlights.set("hit", new Highlight(...found));
  if (paint && nth != null && found[nth]) CSS.highlights.set("hit-now", new Highlight(found[nth]));
  return found;
}
function closeDrawer() { document.body.classList.remove("nav-open"); $("menu").setAttribute("aria-expanded", "false"); }
function show(id, sec, nth) {
  if (!byId.has(id)) return; current = id;
  try { history.replaceState(null, "", toHash(id, sec)); } catch (e) {}
  for (const [pid, s] of sections) s.hidden = pid !== id;
  nav(); outline(); closeDrawer();
  const found = mark(nth), hit = nth != null && found[nth];
  const anchor = sec && sections.get(id).querySelector(`[data-slug="${CSS.escape(sec)}"]`);
  if (hit) {  // a search result: open what hides it, and bring it a third of the way down the window
    for (let d = hit.startContainer.parentElement.closest("details"); d; d = d.parentElement.closest("details")) d.open = true;
    window.scrollTo(0, Math.max(0, window.scrollY + hit.getBoundingClientRect().top - window.innerHeight / 3));
  } else if (anchor) anchor.scrollIntoView(); else window.scrollTo(0, 0);
}

// Diagram viewer: its own zoom and pan; the wheel zooms the diagram around the pointer, never the page behind it.
const zoom = $("zoom"), stage = $("zstage"), canvas = $("zcanvas");
const Z = { s: 1, x: 0, y: 0, w: 1, h: 1, last: null };
function zApply() { canvas.style.transform = `translate(${Z.x}px, ${Z.y}px) scale(${Z.s})`; $("zlevel").textContent = Math.round(Z.s * 100) + "%"; }
function zFit() { const r = stage.getBoundingClientRect(); Z.s = Math.min((r.width - 48) / Z.w, (r.height - 48) / Z.h, 4); Z.x = (r.width - Z.w * Z.s) / 2; Z.y = (r.height - Z.h * Z.s) / 2; zApply(); }
function zAt(f, cx, cy) { const s = Math.min(12, Math.max(0.1, Z.s * f)), k = s / Z.s; Z.x = cx - (cx - Z.x) * k; Z.y = cy - (cy - Z.y) * k; Z.s = s; zApply(); }
function zCenter(f) { const r = stage.getBoundingClientRect(); zAt(f, r.width / 2, r.height / 2); }
function openZoom(path, title) {
  const doc = new DOMParser().parseFromString(W.svgs[path], "image/svg+xml");
  doc.querySelectorAll("script, foreignObject").forEach(n => n.remove());
  canvas.replaceChildren(document.importNode(doc.documentElement, true));
  const svg = canvas.querySelector("svg"), vb = svg.viewBox && svg.viewBox.baseVal;
  Z.w = vb && vb.width ? vb.width : svg.getBBox().width; Z.h = vb && vb.height ? vb.height : svg.getBBox().height;
  svg.setAttribute("width", Z.w); svg.setAttribute("height", Z.h); svg.style.maxWidth = "none";
  $("ztitle").textContent = title || "Diagram";
  Z.last = document.activeElement; zoom.hidden = false; document.body.style.overflow = "hidden"; zFit(); $("zclose").focus();
}
function closeZoom() { zoom.hidden = true; document.body.style.overflow = ""; canvas.replaceChildren(); Z.last && Z.last.focus && Z.last.focus(); }
stage.addEventListener("wheel", e => { e.preventDefault(); const r = stage.getBoundingClientRect(); zAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
const ptrs = new Map(); let pinch = 0;
stage.addEventListener("pointerdown", e => { stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); stage.classList.add("dragging"); });
stage.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return; const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) {  // pinch: zoom around the midpoint of the two fingers
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = stage.getBoundingClientRect();
    if (pinch) zAt(d / pinch, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); pinch = d;
  } else { Z.x += e.clientX - prev.x; Z.y += e.clientY - prev.y; zApply(); }
});
const endPtr = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = 0; if (!ptrs.size) stage.classList.remove("dragging"); };
stage.addEventListener("pointerup", endPtr); stage.addEventListener("pointercancel", endPtr);
stage.addEventListener("dblclick", e => { const r = stage.getBoundingClientRect(); zAt(1.8, e.clientX - r.left, e.clientY - r.top); });
$("zin").onclick = () => zCenter(1.4); $("zout").onclick = () => zCenter(1 / 1.4);
$("zfit").onclick = zFit; $("zclose").onclick = closeZoom;
$("z100").onclick = () => { const r = stage.getBoundingClientRect(); Z.s = 1; Z.x = (r.width - Z.w) / 2; Z.y = (r.height - Z.h) / 2; zApply(); };
window.addEventListener("resize", () => { if (!zoom.hidden) zFit(); });

// Keys: in the diagram viewer, zoom and close; on the page, "/" goes to search, "[" and "]" fold the side bars, and
// Esc leaves search or closes the drawer.
document.addEventListener("keydown", e => {
  if (!zoom.hidden) {
    if (e.key === "Escape") closeZoom(); else if (e.key === "+" || e.key === "=") zCenter(1.4); else if (e.key === "-") zCenter(1 / 1.4); else if (e.key === "0") zFit();
    return;
  }
  const typing = e.target.closest && e.target.closest("input, textarea, select, [contenteditable]");
  if (e.key === "/" && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); fold("side", false); document.body.classList.add("nav-open"); $("q").focus(); $("q").select(); }
  else if ((e.key === "[" || e.key === "]") && !typing && !e.ctrlKey && !e.metaKey && !e.altKey) { const which = e.key === "[" ? "side" : "toc"; fold(which, !folded[which]); }
  else if (e.key === "Escape") {
    if (e.target === $("q") && $("q").value) { $("q").value = ""; nav(); mark(); } else if (e.target === $("q")) $("q").blur();
    closeDrawer();
  }
});

// Theme: follow the system unless the reader picks one (remembered in this browser when storage is available).
let theme = "system";
try { theme = localStorage.getItem("code-map-wiki-theme") || "system"; } catch (e) {}
function applyTheme() {
  if (theme === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = theme;
  $("theme").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.set === theme)));
}
$("theme").addEventListener("click", e => {
  const b = e.target.closest("button[data-set]"); if (!b) return;
  theme = b.dataset.set; applyTheme();
  try { localStorage.setItem("code-map-wiki-theme", theme); } catch (err) {}
});
applyTheme();

$("nav").addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) show(b.dataset.id, "", b.dataset.hit != null && query() ? +b.dataset.hit : undefined); });
for (const box of ["foot", "status"])
  $(box).addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) show(b.dataset.id); });
$("page").addEventListener("click", e => { const b = e.target.closest("button[data-go]"); if (b) show(b.dataset.go); });
$("q").addEventListener("input", () => { nav(); mark(); });
$("menu").addEventListener("click", () => { const open = document.body.classList.toggle("nav-open"); $("menu").setAttribute("aria-expanded", String(open)); });
$("scrim").addEventListener("click", closeDrawer);
const reading = W.pages.filter(p => !FOOT.some(f => f[0] === p.kind)).length;
$("sub").textContent = `${reading} pages` + (window.marked ? "" : " · Markdown renderer missing: showing source");
if (W.generated) $("built").textContent = "Built " + W.generated;
// Only what a reader should know: pages whose code moved on, or whose links lead nowhere. The lint's full report is
// for the maintainer, in the terminal.
const stale = Object.keys(W.notices || {}).filter(id => byId.has(id));
if (stale.length) {
  const st = $("status"); st.hidden = false;
  st.innerHTML = `${stale.length === 1 ? "1 page" : stale.length + " pages"} may be out of date:` +
    stale.map(id => `<button type="button" data-id="${esc(id)}">${esc(byId.get(id).title)}</button>`).join("");
}
function fromAddress() {
  try { const [h, sec] = fromHash(location.hash); if (byId.has(h)) { show(h, sec); return; } } catch (e) {}
  show(current);
}
W.pages.forEach(build);
window.addEventListener("hashchange", fromAddress);  // typed addresses and the browser's back and forward buttons
fromAddress();

// Review comments, where this page is published as an Artifact: select text in a page and press Comment, or comment
// on the page as a whole. The platform's own comment box opens, quoting the selection; the platform stores and shows
// every thread. Opened from a file, there is no comment service and nothing below appears.
(async () => {
  let comments = null;
  try { comments = window.claude && window.claude.use ? await window.claude.use("comments") : null; } catch (e) {}
  if (!comments) return;
  const btn = document.createElement("button");
  btn.type = "button"; btn.id = "comment-sel"; btn.textContent = "Comment"; btn.hidden = true;
  document.body.appendChild(btn);
  let range = null, timer = null;
  const off = () => { btn.hidden = true; range = null; };
  const place = () => {
    const sel = document.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return off();
    const r = sel.getRangeAt(0);
    if (!$("page").contains(r.commonAncestorContainer)) return off();
    range = r.cloneRange();
    const box = r.getBoundingClientRect();
    btn.style.top = Math.round(box.bottom + window.scrollY + 8) + "px";
    btn.style.left = Math.round(Math.max(8, Math.min(box.left + window.scrollX, document.documentElement.clientWidth - 110))) + "px";
    btn.hidden = false;
  };
  document.addEventListener("selectionchange", () => { clearTimeout(timer); timer = setTimeout(place, 120); });
  btn.addEventListener("mousedown", e => e.preventDefault());  // keep the selection while pressing
  const open = async target => {
    try { await comments.openComposer(target); }
    catch (e) {
      if (e && ["unavailable", "not_granted", "forbidden", "capability_disabled", "capability_removed"].includes(e.code)) {
        btn.remove(); document.querySelectorAll(".page-comment").forEach(b => b.remove());
        $("sub").textContent += " · commenting is off here";
      }
    }
  };
  btn.addEventListener("click", () => { if (range) open({ range }); off(); });
  for (const [, sect] of sections) {  // one control per page for comments on the page as a whole
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip page-comment"; b.textContent = "Comment on this page";
    b.addEventListener("click", () => open({ element: sect.querySelector("article h1") || sect.querySelector("article") }));
    const meta = sect.querySelector(".meta"); meta.hidden = false; meta.appendChild(b);
  }
  $("sub").textContent += " · select text to comment";
})();
</script>
</body>
</html>
