body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 var(--body); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 64px; display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.2; text-wrap: balance; margin: 0; }

p { margin: 0; }
ul, ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--mono); font-size: 0.86em; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
section { display: grid; gap: 16px; }
[hidden] { display: none !important; }
.label { font-weight: 650; font-size: 0.8rem; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
.lede { color: var(--muted); max-width: 64ch; }
.how { display: grid; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.counter { font-weight: 600; }
.steps summary { cursor: pointer; }
.steps[open] summary { margin-bottom: 6px; }
.saved { color: var(--muted); font-size: 0.88rem; }
.saved.bad { color: var(--accent); font-weight: 600; }
.conn { font-size: 0.92rem; }
.conn.live::before { content: "\25CF  "; color: var(--ok); }
.donebar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.backup { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.backup .buttons, .composer .buttons { display: flex; flex-wrap: wrap; gap: 8px; }

.gloss > div { display: grid; grid-template-columns: minmax(130px, 190px) minmax(0, 1fr); gap: 4px 16px; padding: 10px 14px; border-top: 1px solid var(--line); scroll-margin-top: 16px; }
.gloss > div:first-child { border-top: 0; }
.gloss dt { font-family: var(--mono); font-size: 0.86rem; padding-top: 3px; overflow-wrap: anywhere; }
.gloss dd { margin: 0; min-width: 0; display: grid; gap: 4px; }
.gloss .src { color: var(--muted); font-size: 0.92rem; }
.q { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--radius); padding: 18px 18px 16px; display: grid; gap: 12px; scroll-margin-top: 16px; min-width: 0; }
.q.is-done { border-left-color: var(--ok); }
.q.is-changed, .q.report { border-left-color: var(--wait); }
.q.report.is-built { border-left-color: var(--ok); }
.qhead { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; justify-content: space-between; }
.qhead .ref { font-family: var(--mono); font-size: 0.8rem; font-weight: 500; color: var(--muted); margin-left: 6px; white-space: nowrap; }
.chip { font: 650 0.78rem/1 var(--body); letter-spacing: 0.04em; padding: 5px 8px; border-radius: 999px; white-space: nowrap; }
.chip.need { background: var(--accent-soft); color: var(--accent); }
.chip.done { background: var(--ok-soft); color: var(--ok); }
.chip.changed, .chip.progress { background: var(--wait-soft); color: var(--wait); }
.block { display: grid; gap: 6px; min-width: 0; }
.example { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; }
.outcome { background: var(--ok-soft); border-radius: 8px; padding: 10px 12px; }
.notice { background: var(--wait-soft); color: var(--ink); border-radius: 8px; padding: 10px 12px; font-size: 0.95rem; }
fieldset.opts { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
fieldset.opts legend { padding: 0; margin-bottom: 8px; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt input[type="radio"] { margin: 5px 0 0; width: 1.05em; height: 1.05em; accent-color: var(--accent); }
.opt b { display: block; }
.opt .rec { display: block; color: var(--accent); font-weight: 650; font-size: 0.88rem; margin-top: 2px; }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt .other-body { display: grid; gap: 6px; }

button.ghost { color: var(--accent); background: transparent; border: 1px solid var(--accent); }
button.solid { color: var(--panel); background: var(--accent); border: 1px solid var(--accent); }

.single { display: grid; gap: 12px; }

figcaption { font-size: 0.9rem; color: var(--muted); }
.scroll { overflow-x: auto; }
table.mini { border-collapse: collapse; font-size: 0.93rem; width: 100%; }

.threads { display: grid; gap: 10px; border-top: 1px dashed var(--line); padding-top: 10px; min-width: 0; }
.thread { display: grid; gap: 6px; border-left: 3px solid var(--line); padding-left: 10px; min-width: 0; }
.quote { margin: 0; padding: 4px 10px; border-left: 3px solid var(--accent); background: var(--accent-soft); font-size: 0.92rem; white-space: pre-wrap; overflow-wrap: anywhere; }

.tabs button { font: 600 0.95rem var(--body); color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 7px 12px; cursor: pointer; min-height: 40px; }
.tabs button:hover { color: var(--ink); border-color: var(--line); }
.tabs button[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
.tabs .count { display: inline-block; min-width: 1.4em; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--panel); font-size: 0.8rem; line-height: 1.5; text-align: center; }
.tabs .count:empty { display: none; }
.panel { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
.wrap, section, .q { grid-template-columns: minmax(0, 1fr); }
.switch { display: flex; flex-wrap: wrap; gap: 6px; }

.preview img { max-height: 70vh; object-fit: contain; }

footer { color: var(--muted); font-size: 0.85rem; }
@media (max-width: 620px) {

  .pair { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 1.7rem; }
  .q { padding: 14px 12px; }
}
@media (prefers-reduced-motion: no-preference) { .opt { transition: border-color .15s, background .15s; } html { scroll-behavior: smooth; } }

            return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(s.label || s.url) + "</a>" + (s.note ? " " + inline(s.note) : "");
          }).join(" · ") }));
        }
        var row = el("div", { id: "g-" + g.anchor }, el("dt", { text: g.term }), dd);
        dd.append(place("g-" + g.anchor, row));
        dl.append(row);
      });
      tab("glossary", T.tab_glossary, T.glossary_title, dl);
    }
    app.append(ui.tabs);
    Object.keys(ui.panels).forEach(function (k) { app.append(ui.panels[k].panel); });
    wireTabs();
    var asks = status.filter(function (s) { return s.p.action; }).length;  // reports with something for the user to do
    if (ui.panels.status && asks) ui.panels.status.tab.querySelector(".count").textContent = String(asks);
    app.append(el("footer", { text: T.built_with + (DATA.generated ? " · " + clock(DATA.generated) : "") }));
    ui.next.addEventListener("click", function (e) {
      var id = (ui.next.getAttribute("href") || "").replace(/^#q-/, "");
      if (!cards[id]) return;
      e.preventDefault();
      reveal(cards[id].root);
      (cards[id].radios[0] || cards[id].other).focus({ preventScroll: true });
    });
    ui.done.addEventListener("click", function () {
      ui.done.disabled = true;
      Promise.resolve(store.done()).then(function (text) { ui.doneMsg.textContent = text; ui.doneMsg.classList.remove("bad"); },
        function (e) { ui.doneMsg.textContent = fill(T.done_failed, { why: (e && (e.code || e.message)) || "error" }); ui.doneMsg.classList.add("bad"); })
        .then(function () { ui.done.disabled = false; });
    });
    order.forEach(paint);
  }

  // ---------- tabs (WAI-ARIA tabs pattern): arrow keys move between tabs, the last tab is remembered for this
  // page, and a link to a card or a term on another tab opens that tab.
  var tabKey = "decision-brief-tab:" + DATA.page_id;
  function selectTab(key, focus) {
    Object.keys(ui.panels).forEach(function (k) {
      var on = k === key, t = ui.panels[k];
      t.tab.setAttribute("aria-selected", String(on));
      t.tab.tabIndex = on ? 0 : -1;
      t.panel.hidden = !on;
    });
    if (focus) ui.panels[key].tab.focus();
    try { localStorage.setItem(tabKey, key); } catch (e) { /* remembered for this visit only */ }
  }
  function reveal(node) {
    var panel = node && node.closest('[role="tabpanel"]');
    if (panel) selectTab(panel.id.replace(/^panel-/, ""), false);
    if (node) node.scrollIntoView({ block: "start" });
    return !!panel;
  }
  function wireTabs() {
    var keys = Object.keys(ui.panels);
    keys.forEach(function (k, i) {
      var t = ui.panels[k].tab;
      t.addEventListener("click", function () { selectTab(k, false); });
      t.addEventListener("keydown", function (e) {
        var j = e.key === "ArrowRight" ? i + 1 : e.key === "ArrowLeft" ? i - 1 : e.key === "Home" ? 0 : e.key === "End" ? keys.length - 1 : null;
        if (j === null) return;
        e.preventDefault();
        selectTab(keys[(j + keys.length) % keys.length], true);
      });
    });
    var saved = null;
    try { saved = localStorage.getItem(tabKey); } catch (e) { /* no stored tab */ }
    selectTab(ui.panels[saved] ? saved : "open", false);
  }
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a || a === ui.next) return;
    var node = document.getElementById(a.getAttribute("href").slice(1));
    if (!node) return;
    e.preventDefault();
    reveal(node);
  });
  window.addEventListener("hashchange", function () { reveal(document.getElementById(location.hash.slice(1))); });

  // ---------- comment threads on the local page
  function rootOf(c, byId) {
    while (c && c.parent && byId[c.parent]) c = byId[c.parent];
    return c;
  }
  function drawThreads() {
    var byId = {}, groups = {}, roots = [];
    comments.forEach(function (c) { byId[c.id] = c; });
    comments.forEach(function (c) {
      var r = rootOf(c, byId);
      if (!r) return;
      if (!groups[r.id]) { groups[r.id] = []; roots.push(r); }
      groups[r.id].push(c);
    });
    Object.keys(boxes).forEach(function (target) {
      var box = boxes[target];
      roots.filter(function (r) { return r.target === target; }).forEach(function (r) {
        var t = box.querySelector('[data-root="' + r.id + '"]');
        if (!t) {
          t = el("div", { class: "thread", "data-root": r.id }, r.quote ? el("blockquote", { class: "quote", text: r.quote }) : null,
            el("ul", { class: "msgs" }), composer(target, r.id, ""));
          box.insertBefore(t, box.querySelector(":scope > .composer"));
        }
        messages(t.querySelector(".msgs"), groups[r.id]);
      });
      box.hidden = !box.children.length;
    });
    paintAsk();
  }
  function messages(ul, msgs) {
    ul.textContent = "";
    msgs.forEach(function (m) {
      var mine = m.by === "user";
      var text = el("div", { class: "text" });
      if (mine) text.textContent = m.text; else text.append(blocks(m.text));
      ul.append(el("li", { class: "msg " + (mine ? "from-user" : "from-agent") },
        el("div", { class: "who" }, el("b", { text: mine ? T.you : (m.name || T.agent) }), " " + clock(m.at)), text));
      if (m.ask === "pending") ul.append(el("li", { class: "msg pending", text: fill(T.asking, { name: live.ask ? live.ask.name : T.agent }) }));
    });
  }
  // A form that starts a thread on target (root empty) or replies in thread root.
  function composer(target, root, quote) {
    var ta = el("textarea", { rows: 2, "aria-label": root ? T.reply_hint : T.comment_label, placeholder: root ? T.reply_hint : T.comment_hint });
    var send = el("button", { type: "submit", class: "ghost", text: root ? T.reply : T.comment_send });
    var ask = el("button", { type: "button", class: "ghost", "data-ask": "", hidden: true });
    var msg = el("span", { class: "saved", "aria-live": "polite" });
    var form = el("form", { class: "composer" }, quote ? el("blockquote", { class: "quote", text: quote }) : null, ta,
      el("div", { class: "row" }, msg, el("span", { class: "buttons" }, ask, send)));
    function post(withAsk) {
      if (!ta.value.trim()) { ta.focus(); return; }
      msg.textContent = T.saving; msg.classList.remove("bad");
      var body = { text: ta.value, ask: !!withAsk };
      if (root) body.parent = root; else { body.target = target; if (quote) body.quote = quote; }
      store.post(body).then(function (c) {
        ta.value = ""; msg.textContent = "";
        comments.push(c);
        if (!root) form.remove();
        drawThreads();
      }, function (e) { msg.textContent = fill(T.not_saved, { why: (e && e.code) || "error" }); msg.classList.add("bad"); });
    }
    form.addEventListener("submit", function (e) { e.preventDefault(); post(false); });
    ask.addEventListener("click", function () { post(true); });
    return form;
  }
  function openLocalComposer(target, quote) {
    var box = boxes[target] || boxes.page;
    var form = box.querySelector(":scope > .composer");
    if (form && !quote) { form.querySelector("textarea").focus(); return; }
    if (form) form.remove();
    form = composer(target, "", quote);
    box.append(form);
    box.hidden = false;
    paintAsk();
    form.querySelector("textarea").focus();
  }
  function paintAsk() {
    var show = !!(live.ask && live.agent.state !== "listening");
    document.querySelectorAll("[data-ask]").forEach(function (b) {
      b.hidden = !show;
      if (live.ask) b.textContent = fill(T.ask_now, { name: live.ask.name });
    });
  }
  function paintConnection() {
    var a = live.agent || {}, name = a.name || T.agent;
    var text = a.state === "listening" ? fill(T.conn_listening, { name: name })
      : a.state === "working" ? fill(T.conn_working, { name: name }) : T.conn_away;
    if (live.ask && a.state !== "listening") text += " " + fill(T.conn_ask, { name: live.ask.name });
    ui.conn.textContent = text;
    ui.conn.classList.toggle("live", a.state === "listening");
    ui.conn.hidden = false;
    paintAsk();
  }

  // ---------- select text to comment on it
  var selBtn = document.getElementById("sel-comment"), selRange = null, selTimer = null;
  selBtn.textContent = T.comment_sel;
  function hideSel() { selBtn.hidden = true; selRange = null; }
  function targetOf(node) {
    var e = node && (node.nodeType === 1 ? node : node.parentElement);
    var hit = e && e.closest("[data-target]");
    return hit ? hit.getAttribute("data-target") : "page";
  }
  function placeSel() {
    var sel = document.getSelection();
    if (!store || !store.canComment || !sel || sel.isCollapsed || !sel.rangeCount) return hideSel();
    var r = sel.getRangeAt(0), host = r.commonAncestorContainer;
    host = host.nodeType === 1 ? host : host.parentElement;
    if (!host || !document.getElementById("brief").contains(host) || host.closest("textarea, input, form, .threads, button")) return hideSel();
    if (!sel.toString().trim()) return hideSel();
    selRange = r.cloneRange();
    var box = r.getBoundingClientRect();
    selBtn.style.top = Math.round(box.bottom + window.scrollY + 8) + "px";
    selBtn.style.left = Math.round(Math.max(8, Math.min(box.left + window.scrollX, document.documentElement.clientWidth - 140))) + "px";
    selBtn.hidden = false;
  }
  document.addEventListener("selectionchange", function () { clearTimeout(selTimer); selTimer = setTimeout(placeSel, 150); });
  selBtn.addEventListener("mousedown", function (e) { e.preventDefault(); });  // keep the selection while pressing
  selBtn.addEventListener("click", function () {
    if (!selRange || !store) return;
    var target = targetOf(selRange.commonAncestorContainer);
    store.comment(target, selRange, selRange.toString().replace(/\s+/g, " ").trim());
    hideSel();
  });

  // ---------- keeping answers without a store: download, copy, text
  function answersDoc() {
    var out = {};
    order.forEach(function (id) { var a = current(id); a.at = stamps[id] || null; out[id] = a; });
    return { app: "decision-brief", format: 2, title: DATA.title, page_id: DATA.page_id, saved: new Date().toISOString(), answers: out, comments: comments };
  }
  function answersText() {
    var lines = ["Answers from the decision page: " + DATA.title];
    order.forEach(function (id) {
      var c = cards[id], a = current(id), what;
      if (a.choice == null) what = T.no_choice;
      else if (a.choice === "other") what = T.other + ": " + a.other;
      else {
        var opt = (c.q.options || []).filter(function (o) { return o.id === a.choice; })[0];
        what = (opt ? opt.label.replace(/[*`]/g, "") : a.choice) + " (" + a.choice + ")";
      }
      lines.push("[" + id + "] " + c.q.title + " -> " + what + (a.note.trim() ? " | note: " + a.note.trim() : ""));
    });
    return lines.join("\n");
  }
  function backupPanel() {
    var msg = el("span", { class: "saved", "aria-live": "polite" });
    ui.dump = el("textarea", { readonly: true, rows: 6, "aria-label": T.show_text });
    // inside claude.ai the frame blocks downloads a page starts, so there only Copy and the text are offered
    var dl = el("button", { type: "button", class: "ghost", text: T.download, hidden: !!window.claude });
    dl.addEventListener("click", function () {
      var blob = new Blob([JSON.stringify(answersDoc(), null, 2) + "\n"], { type: "application/json" });
      var a = el("a", { href: URL.createObjectURL(blob), download: "answers.json" });
      document.body.append(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    });
    var cp = el("button", { type: "button", class: "ghost", text: T.copy });
    var details = el("details", {}, el("summary", { text: T.show_text }), ui.dump);
    cp.addEventListener("click", function () {
      var text = answersText();
      var p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject();
      p.then(function () { msg.textContent = T.copied; }, function () {
        msg.textContent = T.copy_failed; details.open = true; ui.dump.value = text; ui.dump.focus(); ui.dump.select();
      });
    });
    ui.backup = el("div", { class: "backup", hidden: true }, el("span", { class: "label", text: T.backup_title }),
      el("div", { class: "buttons" }, dl, cp), msg, details);
    return ui.backup;
  }
  function showBackup() { if (ui.backup) { ui.backup.hidden = false; ui.dump.value = answersText(); } }
  function setStatus(text, bad) { ui.status.textContent = text; ui.status.classList.toggle("bad", !!bad); }

  // ---------- answer stores: claude.ai Artifact storage, the local server, or this browser only
  function use(name) {
    return Promise.resolve().then(function () { return window.claude.use(name); }).catch(function () { return null; });
  }
  function artifactStore() {
    if (!window.claude || typeof window.claude.use !== "function") return Promise.resolve(null);
    return Promise.all([use("db"), use("comments"), use("user")]).then(function (caps) {
      var db = caps[0], cm = caps[1], user = caps[2], me = null;
      if (!db) return { failed: T.status_no_db };
      if (user && user.id) Promise.resolve(user.id()).then(function (v) { me = v; }, function () {});
      var off = ["unavailable", "not_granted", "forbidden", "capability_disabled", "capability_removed"];
      var s = {
        status: T.status_artifact,
        canComment: !!cm,
        by: function () { return me; },
        start: function () {
          db.collection("answers").onSnapshot(function (snap) {
            snap.docs.forEach(function (d) { applyRemote(d.id, d.data()); });
          }, function (e) { setStatus(fill(T.not_saved, { why: (e && e.code) || "error" }), true); showBackup(); });
          if (cm) { ui.conn.textContent = T.conn_artifact; ui.conn.hidden = false; }
          if (cm && cm.canSendToClaude) {
            Promise.resolve(cm.canSendToClaude()).then(function (v) { ui.done.hidden = v !== "available"; }, function () {});
          }
        },
        save: function (id, doc) { return db.doc("answers/" + id).set(doc); },
        comment: function (target, range) {
          var where = range ? { range: range } : { element: places[target] || places.page };
          return Promise.resolve(cm.openComposer(where)).catch(function (e) {
            if (e && off.indexOf(e.code) >= 0) document.querySelectorAll("[data-comment]").forEach(function (b) { b.hidden = true; });
          });
        },
        done: function () {
          return Promise.resolve(cm.anchorFor(places.page)).then(function (anchor) {
            return cm.sendToClaude({ anchor: anchor, text: T.done_text });
          }).then(function () { return fill(T.done_sent_live, { name: "Claude" }); });
        }
      };
      return s;
    });
  }
  function localStore() {
    var rev = -1, up = true;
    function api(path, opts) {
      opts = opts || {};
      opts.cache = "no-store";
      opts.headers = { "Content-Type": "application/json", "X-Brief-Token": CONFIG.token };
      return fetch(CONFIG.api + path, opts).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (body) {
          if (!r.ok) throw { code: body.error || "HTTP " + r.status };
          return body;
        });
      });
    }
    function apply(state) {
      rev = state.rev;
      Object.keys(state.answers || {}).forEach(function (id) { applyRemote(id, state.answers[id]); });
      comments = state.comments || [];
      live.agent = state.agent || live.agent;
      live.ask = state.ask || null;
      drawThreads();
      paintConnection();
    }
    function loop() {  // the server holds each request until something changes, so updates arrive at once
      api("state?since=" + rev + "&agent=" + encodeURIComponent((live.agent && live.agent.state) || "")).then(function (state) {
        if (!up) { up = true; setStatus(T.status_local); }
        apply(state);
        loop();
      }, function () {
        if (up) { up = false; setStatus(T.status_local_down, true); showBackup(); }
        setTimeout(loop, 3000);
      });
    }
    return api("state?since=-1").then(function (state) {
      apply(state);
      return {
        status: T.status_local,
        canComment: true,
        start: function () { ui.done.hidden = false; loop(); },
        save: function (id, doc) { return api("answers/" + encodeURIComponent(id), { method: "PUT", body: JSON.stringify(doc) }); },
        post: function (body) { return api("comments", { method: "POST", body: JSON.stringify(body) }); },
        comment: function (target, range, quote) { openLocalComposer(target, quote); },
        done: function () {
          return api("done", { method: "POST", body: JSON.stringify({}) }).then(function () {
            var a = live.agent || {};
            return a.state === "listening" ? fill(T.done_sent_live, { name: a.name || T.agent }) : T.done_sent;
          });
        }
      };
    }, function () { return { failed: T.status_local_down }; });
  }
  function staticStore() {
    var key = "decision-brief:" + DATA.page_id, kept = { answers: {} }, lasting = true;
    try { kept = JSON.parse(localStorage.getItem(key) || "null") || kept; } catch (e) { lasting = false; }
    return {
      status: lasting ? T.status_static : T.status_static_volatile,
      canComment: false,
      start: function () { Object.keys(kept.answers || {}).forEach(function (id) { applyRemote(id, kept.answers[id]); }); },
      save: function (id, doc) {
        kept.answers[id] = doc;
        try { localStorage.setItem(key, JSON.stringify(kept)); } catch (e) { /* kept for this visit only */ }
        return Promise.resolve();
      }
    };
  }

  render();
  if (location.hash) reveal(document.getElementById(location.hash.slice(1)));
  var pick = CONFIG.mode === "local" ? localStore() : artifactStore();
  pick.then(function (s) {
    var why = null;
    if (s && s.failed) { why = s.failed; s = null; }
    store = s || staticStore();
    setStatus(why || store.status, !!why);
    if (!s) showBackup();
    document.querySelectorAll("[data-comment]").forEach(function (b) { b.hidden = !store.canComment; });
    document.querySelectorAll("[data-needs-comments]").forEach(function (li) { li.hidden = !store.canComment; });
    store.start();
  });
})();
</script>
